  <script>
    /* Celulares angostos: el juego se dibuja a 480 de ancho y se achica para entrar entero. */
    (function () {
      var ANCHO_MINIMO = 480;
      var corto = Math.min(screen.width || 9999, screen.height || 9999);
      if (corto >= ANCHO_MINIMO) return;
      var m = document.querySelector('meta[name=viewport]');
      if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
      m.setAttribute('content', 'width=' + ANCHO_MINIMO + ', user-scalable=no');
      document.documentElement.classList.add('celular-angosto');
    })();
  </script>
