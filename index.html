  <script>
    /* Celulares angostos: el juego se dibuja a 480 de ancho y se achica para entrar entero. */
    (function () {
      var ANCHO_MINIMO = 480;
      var corto = Math.min(screen.width || 9999, screen.height || 9999);
      if (corto >= ANCHO_MINIMO) return;
      var m = document.querySelector('meta[name=viewport]');
      if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
      m.setAttribute('content', 'width=' + ANCHO_MINIMO + ', user-scalable=no');
      document.documentElement.classList.add('celular-angosto');
    })();
  </script>

  <script>
    /* Versión web (https): se puede instalar como app. En la APK y en el ZIP no hace falta. */
    if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
    /* Botón "Instalar el juego" cuando el navegador lo permite (Chrome y Edge en la PC). */
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      if (document.getElementById('boton-instalar')) return;
      var b = document.createElement('button');
      b.id = 'boton-instalar';
      b.textContent = '⬇ Instalar el juego';
      b.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:9000;padding:.55em 1em;border-radius:999px;border:1px solid #ffd45a;background:#2a1a48;color:#fff3d0;font:700 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.6)';
      b.onclick = function () { e.prompt(); e.userChoice.finally(function () { b.remove(); }); };
      document.body.appendChild(b);
    });
    window.addEventListener('appinstalled', function () { var b = document.getElementById('boton-instalar'); if (b) b.remove(); });
  </script>
